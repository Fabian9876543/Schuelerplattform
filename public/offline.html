<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keine Verbindung</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
      }
      .karte { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #64748b; }
      button {
        border: 0;
        border-radius: 0.5rem;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-weight: 500;
        padding: 0.625rem 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="karte">
      <h1>Keine Verbindung</h1>
      <p>
        Die Schuelerplattform braucht Internet, weil dein Lernplan und die Nachrichten auf dem
        Server liegen. Sobald du wieder Netz hast, geht es weiter.
      </p>
      <button type="button" onclick="location.reload()">Nochmal versuchen</button>
    </div>
  </body>
</html>
